apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholargraph-frontend
  namespace: scholargraph
  labels:
    app: scholargraph
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scholargraph
      component: frontend
  template:
    metadata:
      labels:
        app: scholargraph
        component: frontend
    spec:
      containers:
        - name: frontend
          image: scholargraph/frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scholargraph-frontend-svc
  namespace: scholargraph
spec:
  selector:
    app: scholargraph
    component: frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
