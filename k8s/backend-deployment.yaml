apiVersion: apps/v1
kind: Deployment
metadata:
  name: scholargraph-backend
  namespace: scholargraph
  labels:
    app: scholargraph
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scholargraph
      component: backend
  template:
    metadata:
      labels:
        app: scholargraph
        component: backend
    spec:
      containers:
        - name: backend
          image: scholargraph/backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: scholargraph-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: scholargraph-backend-svc
  namespace: scholargraph
spec:
  selector:
    app: scholargraph
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
